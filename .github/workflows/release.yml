name: Release

# 正式版发布（2026-09-22 起，替代「正式版人工上传」的旧约定）：
# - 推送 tag `v*`（如 v1.0.0）：对该提交构建 + Plugin Verifier 验证 + 发布 GitHub Releases 正式版
# - 或 workflow_dispatch 手动输入版本号：对当前分支 HEAD 发布
# - 若配置了 MARKETPLACE_PUBLISH_TOKEN secret，同一构建额外自动上传 JetBrains Marketplace
# 版本号硬约束见 AGENTS.md：必须大于上一正式版（dev 为 0.1.<run_number>，正式版走 x.y.z）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (x.y.z, must be greater than the previous official release)'
        required: true

jobs:
  release:
    name: Release plugin
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid version: $VERSION (expected x.y.z)"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing Top Status Bar $VERSION"

      - name: Build plugin
        run: ./gradlew buildPlugin -PbuildVersion="${{ steps.ver.outputs.version }}" --no-daemon --stacktrace

      - name: Run Plugin Verifier
        # 最低支持版本 2023.3 + 编译基线 2024.1 + 当前推荐版本（build.gradle.kts pluginVerification）
        run: ./gradlew verifyPlugin -PbuildVersion="${{ steps.ver.outputs.version }}" --no-daemon --stacktrace

      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: top-status-bar-${{ steps.ver.outputs.version }}
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-reports-${{ steps.ver.outputs.version }}
          path: build/reports/pluginVerifier/**
          if-no-files-found: warn

      - name: Publish release to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: build/distributions/*.zip
          generate_release_notes: true
          body: |
            **Top Status Bar ${{ steps.ver.outputs.version }}**

            A compact, New UI-style status bar for the IntelliJ main toolbar.

            - Compatibility: IntelliJ IDEA 2023.3+ (since-build 233)
            - Plugin Verifier passed for 2023.3 / 2024.1 / latest recommended releases (see verifier-reports artifact)
            - Install via `Settings → Plugins → ⚙ → Install Plugin from Disk…`, or from JetBrains Marketplace once listed

      - name: Publish to JetBrains Marketplace
        env:
          MARKETPLACE_PUBLISH_TOKEN: ${{ secrets.MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$MARKETPLACE_PUBLISH_TOKEN" ]; then
            echo "MARKETPLACE_PUBLISH_TOKEN secret is not set — skipping Marketplace upload."
            echo "To enable automatic uploads, create a JetBrains Marketplace publish token and add it as a repository secret."
            exit 0
          fi
          ./gradlew publishPlugin \
            -PbuildVersion="${{ steps.ver.outputs.version }}" \
            -PmarketplaceToken="$MARKETPLACE_PUBLISH_TOKEN" \
            --no-daemon --stacktrace
